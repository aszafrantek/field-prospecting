<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Field Prospecting</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
:root {
  --bg: #f8fafc; --surface: #fff; --border: #e2e8f0; --border-light: #f1f5f9;
  --text: #0f172a; --muted: #64748b;
  --blue: #2563eb; --blue-bg: #eff6ff;
  --green: #16a34a; --green-bg: #f0fdf4;
  --orange: #ea580c; --orange-bg: #fff7ed;
  --red: #dc2626; --red-bg: #fef2f2;
  --purple: #7c3aed; --purple-bg: #faf5ff;
  --gold: #b45309; --gold-bg: #fef3c7;
  --teal: #0f766e; --teal-bg: #f0fdfa;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ── Header ── */
.hdr { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 14px; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.hdr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.logo { font-size: 17px; font-weight: 800; color: var(--blue); white-space: nowrap; }
.plan-sel { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; font-weight: 500; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.search { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 13px; width: 140px; flex-shrink: 0; }
.search:focus { outline: none; border-color: var(--blue); }
.fsel { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 500; flex-shrink: 0; cursor: pointer; }

/* ── View Tabs (Prospects / No-Visit) ── */
.view-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); }
.vtab { flex: 1; padding: 8px 10px; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.vtab.active { color: var(--blue); border-bottom-color: var(--blue); }
.vtab .nvcount { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 10px; background: var(--green-bg); color: var(--green); margin-left: 4px; }

/* ── Stats ── */
.stats { background: var(--surface); border-bottom: 1px solid var(--border-light); padding: 6px 14px; display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; }
.stats::-webkit-scrollbar { display: none; }
.stat { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 12px; color: var(--muted); flex-shrink: 0; }
.stat b { font-size: 15px; font-weight: 700; color: var(--text); }
.stat b.bl { color: var(--blue); } .stat b.gr { color: var(--green); } .stat b.or { color: var(--orange); } .stat b.gd { color: var(--gold); }

/* ── Grid ── */
.grid { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }

/* ── Day section headers ── */
.day-section { grid-column: 1 / -1; display: contents; }
.day-header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 4px 4px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
.day-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.day-count { font-size: 12px; color: var(--muted); opacity: .7; }
.route-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #fff; background: #1a73e8; border-radius: 6px; padding: 4px 10px; text-decoration: none; white-space: nowrap; }
.route-btn:hover { background: #1558b0; }

/* ── Card ── */
.card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid transparent; border-radius: 10px; padding: 13px; }
.card.sv { border-left-color: #818cf8; } .card.sf { border-left-color: var(--orange); }
.card.sw { border-left-color: var(--green); } .card.sn { border-left-color: #f87171; }
.card.sd { border-left-color: #0ea5e9; }
#syncStatus { font-size: 11px; white-space: nowrap; color: var(--muted); flex-shrink: 0; }
.sync-btn { font-size: 11px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; white-space: nowrap; flex-shrink: 0; }

.card-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.shop-name { font-size: 14px; font-weight: 700; line-height: 1.3; flex: 1; }
.day-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.dh { background: var(--green-bg); color: var(--green); }
.d1 { background: var(--green-bg); color: var(--green); }
.d2 { background: var(--blue-bg); color: var(--blue); }
.d3 { background: var(--purple-bg); color: var(--purple); }
.d4 { background: var(--orange-bg); color: var(--orange); }
.d5 { background: var(--red-bg); color: var(--red); }
.d6 { background: var(--teal-bg); color: var(--teal); }
.d7 { background: var(--gold-bg); color: var(--gold); }
.d8 { background: #fce7f3; color: #be185d; }
.d9 { background: #e0f2fe; color: #0369a1; }
.d10 { background: #ecfccb; color: #3f6212; }

.addr { font-size: 12px; color: var(--muted); margin-bottom: 3px; line-height: 1.4; }
.phone { font-size: 13px; font-weight: 600; color: var(--blue); text-decoration: none; display: block; margin-bottom: 7px; }
.sig-notes { font-size: 11px; color: var(--muted); margin-bottom: 7px; line-height: 1.4; }

.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.tm { background: var(--teal-bg); color: var(--teal); }
.ta { background: var(--blue-bg); color: var(--blue); }
.tp { background: #dc2626; color: #bfdbfe; }
.tb { background: #fbbf24; color: #111111; }
.tM { background: var(--purple-bg); color: var(--purple); }
.tq { background: var(--gold-bg); color: var(--gold); }
.tc { background: var(--orange-bg); color: var(--orange); }
.ts { background: var(--border-light); color: var(--muted); }
.tR { background: #ecfdf5; color: #059669; }

/* Signal dots */
.sig-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.dots { display: flex; gap: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.dot.on { background: #fbbf24; } .dot.hi { background: var(--teal); }
.sig-lbl { font-size: 11px; color: var(--muted); font-weight: 500; }

/* Verify buttons */
.verify { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.vbtn { font-size: 10px; font-weight: 500; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border-light); background: var(--bg); color: #94a3b8; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; opacity: 0.75; }
.vbtn:active { background: var(--border-light); opacity: 1; }
.vbtn.gd-btn { color: #94a3b8; border-color: var(--border-light); background: var(--bg); opacity: 0.75; }
.vbtn.tb { background: #fbbf24; color: #111111; border-color: #fbbf24; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }
.vbtn.tp { background: #dc2626; color: #bfdbfe; border-color: #dc2626; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }
.tf  { background: #f97316; color: #ffffff; }
.tfp { background: #1e293b; color: #f97316; }
.te  { background: #1d4ed8; color: #fde68a; }
.vbtn.tf  { background: #f97316; color: #ffffff; border-color: #f97316; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }
.vbtn.tfp { background: #1e293b; color: #f97316; border-color: #f97316; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }
.vbtn.te  { background: #1d4ed8; color: #fde68a; border-color: #1d4ed8; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }
.trp  { background: #16a34a; color: #ffffff; }
.tcfx { background: #003087; color: #ffffff; }
.vbtn.trp  { background: #16a34a; color: #ffffff; border-color: #16a34a; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }
.vbtn.tcfx { background: #003087; color: #ffffff; border-color: #003087; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }
.tac  { background: #4338ca; color: #ffffff; }
.vbtn.tac { background: #4338ca; color: #ffffff; border-color: #4338ca; opacity: 1; font-weight: 700; font-size: 11px; padding: 4px 8px; }

/* Actions */
.actions { display: flex; gap: 6px; align-items: center; }
.status-sel { flex: 1; padding: 5px 6px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--text); cursor: pointer; }
.notes-btn { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.notes-btn.has { background: var(--gold-bg); border-color: #fcd34d; color: var(--gold); }
.notes-area { width: 100%; margin-top: 6px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--bg); color: var(--text); resize: none; min-height: 50px; font-family: inherit; display: none; }
.notes-area:focus { outline: none; border-color: var(--blue); }
.notes-preview { margin-top: 5px; font-size: 11px; color: var(--gold); font-style: italic; cursor: pointer; }

/* ── No-Visit List ── */
.nv-grid { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.nv-header { padding: 10px 14px 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.nv-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: 10px; padding: 12px; }
.nv-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.nv-city { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.nv-note { font-size: 11px; color: var(--muted); line-height: 1.4; }
.nv-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-bottom: 4px; }
.nv-confirmed { background: var(--green-bg); color: var(--green); }
.nv-empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; grid-column: 1/-1; }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; grid-column: 1/-1; }

@media (max-width: 500px) { .grid { grid-template-columns: 1fr; padding: 8px; gap: 8px; } .search { width: 120px; } .nv-grid { grid-template-columns: 1fr; padding: 8px; } }
/* ── Settings Modal ── */
.settings-btn { font-size: 16px; padding: 4px 7px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; flex-shrink: 0; line-height: 1; }
.settings-btn:hover { background: var(--border-light); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: flex-start; justify-content: center; padding-top: 48px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 14px; padding: 20px; width: 90%; max-width: 460px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,.18); }
.modal h2 { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--text); }
.modal label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.modal input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg); color: var(--text); margin-bottom: 14px; }
.modal input[type=text]:focus { outline: none; border-color: var(--blue); }
.modal .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; margin-top: 4px; }
.modal .plan-checks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.modal .plan-check { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: background .1s; }
.modal .plan-check:hover { background: var(--border-light); }
.modal .plan-check input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--blue); flex-shrink: 0; cursor: pointer; }
.modal .plan-check span { font-size: 13px; font-weight: 500; }
.modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.modal .btn-save { padding: 8px 20px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.modal .btn-save:hover { background: #1d4ed8; }
.modal .btn-cancel { padding: 8px 16px; background: var(--border-light); color: var(--text); border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.modal .btn-cancel:hover { background: var(--border); }
.modal .btn-all { font-size: 11px; color: var(--blue); cursor: pointer; text-decoration: underline; margin-bottom: 8px; display: inline-block; }
.rep-display { font-size: 11px; color: var(--muted); flex-shrink: 0; white-space: nowrap; max-width: 80px; overflow: hidden; text-overflow: ellipsis; }

</style>
</head>

<div class="hdr">

    <div class="logo">⚡ Field Prospecting</div>
    <select class="plan-sel" id="planSel"></select>
    <span id="syncStatus" style="font-size:11px;color:var(--muted);flex-shrink:0">⟳</span>

      <option value="MSO">MSO</option>
      <option value="Marquee">Marquee</option>
      <option value="BG">BG Products</option>
      <option value="Technet">TechNet</option>
      <option value="Fisher">Fisher</option>
      <option value="FMP">FMP</option>
      <option value="Euro">Euro Specialist</option>

          <option value="Assoc">Assoc Member</option>

</div>


<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>⚙ My Settings</h2>
    <label for="repNameInput">Your name (keeps your notes separate from teammates)</label>
    <input type="text" id="repNameInput" placeholder="e.g. Sarah, Mike, Northeast Team…" maxlength="40">
    <div class="section-label">My Territories</div>
    <span class="btn-all" onclick="toggleAllPlans(true)">Select all</span> &nbsp;
    <span class="btn-all" onclick="toggleAllPlans(false)">Deselect all</span>
    <div class="plan-checks" id="planChecks"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
      <button class="btn-save" onclick="saveSettings()">Save &amp; Apply</button>
    </div>
  </div>
</div>

<div class="view-tabs">
  <div class="vtab active" id="tabProspects" onclick="switchView('prospects')">🎯 Prospects</div>
  <div class="vtab" id="tabNoVisit" onclick="switchView('novisit')">✅ Existing Customers <span class="nvcount" id="nvCount">0</span></div>
  <div class="vtab" id="tabTeam" onclick="switchView('team')">&#x1F465; Team Feed</div>
</div>

<div class="stats" id="statsBar">
  <div class="stat"><b id="sTotal">–</b>&nbsp;stops</div>
  <div class="stat"><b class="bl" id="sVisited">–</b>&nbsp;visited</div>
  <div class="stat"><b class="or" id="sFollowup">–</b>&nbsp;follow-up</div>
  <div class="stat"><b class="gr" id="sWon">–</b>&nbsp;demo booked</div>
  <div class="stat"><b class="gd" id="sMitchell">–</b>&nbsp;strong ICP</div>
</div>

<div class="grid" id="grid"></div>
<div id="nvPanel" style="display:none">
  <div class="nv-header" id="nvHeader"></div>
  <div class="nv-grid" id="nvGrid"></div>
</div>

function setSyncStatus(s) {

  el.textContent = s === 'saved' ? '✓ Synced' : s === 'saving' ? '⟳ Saving…' : '⚠ Offline';

      alert('✅ Sync link copied!\n\nOpen this URL on your phone or iPad to share notes & status:\n\n' + link)
    ).catch(() => prompt('Copy this sync link and open it on your other device:', link));
  }
}

function loadFromFirebase() {
  setSyncStatus('saving');
  shopsCol().get().then(snap => {
    snap.forEach(doc => {
      const d = doc.data();
      if (d.status) statusMap[doc.id] = d.status;
      if (d.notes)  notesMap[doc.id]  = d.notes;
    });
    // Seed defaultStatus into Firebase for any shop not yet at that status
    Object.values(PLANS).flat().forEach(p => {
      if (p.defaultStatus && statusMap[p.id] !== p.defaultStatus) {
        statusMap[p.id] = p.defaultStatus;
        shopsCol().doc(p.id).set({ status: p.defaultStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
      }
    });
    try{ localStorage.setItem('fp_status', JSON.stringify(statusMap)); }catch(e){}
    try{ localStorage.setItem('fp_notes',  JSON.stringify(notesMap));  }catch(e){}
    setSyncStatus('saved');
    loadPlan(planSel.value);
  }).catch(() => setSyncStatus('offline'));
}

function startRealtimeSync() {
  shopsCol().onSnapshot(snap => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added' || change.type === 'modified') {
        const d = change.doc.data(), id = change.doc.id;
        const newStatus = d.status || 'new';
        const newNotes  = d.notes  || '';
        const changed = statusMap[id] !== newStatus || (notesMap[id]||'') !== newNotes;
        statusMap[id] = newStatus;
        notesMap[id]  = newNotes;
        if (changed) {
          const card = document.getElementById('card-'+id);
          if (card) {
            const sel = card.querySelector('.status-sel');
            if (sel && sel.value !== newStatus) { sel.value = newStatus; onStatus(sel, true); }
            const ta = card.querySelector('.notes-area');
            if (ta && ta !== document.activeElement && ta.value !== newNotes) {
              ta.value = newNotes;
              const p = currentPlan.find(x=>x.id===id);
              if (p) p.userNotes = newNotes;
              const btn = card.querySelector('.notes-btn');
              if (btn) btn.classList.toggle('has', !!newNotes);
              let prev = card.querySelector('.notes-preview');
              if (newNotes) {
                if (!prev) { prev = document.createElement('div'); prev.className='notes-preview'; prev.onclick=()=>toggleNotes(id); ta.before(prev); }
                prev.textContent = '📌 ' + newNotes;
              } else if (prev) prev.remove();
            }
          }
        }
      }
    });
    setSyncStatus('saved');
    try{ localStorage.setItem('fp_status', JSON.stringify(statusMap)); }catch(e){}
    try{ localStorage.setItem('fp_notes',  JSON.stringify(notesMap));  }catch(e){}
  }, () => setSyncStatus('offline'));
}

  if (view === 'novisit') renderNoVisit();
}

function loadPlan(name) {
  currentPlan = (PLANS[name] || []).map(p => ({
    ...p,
    status: statusMap[p.id] || p.defaultStatus || 'new',
    userNotes: notesMap[p.id] || ''
  }));
  // Rebuild day filter from this plan's actual days
  const days = [...new Set(currentPlan.map(p => p.day))].sort((a,b)=>{
    const order = ['Half-day','Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','Day 7','Day 8','Day 9','Day 10','Day 11','Day 12','Day 13','Day 14','Day 15'];
    return order.indexOf(a) - order.indexOf(b);
  });
  const df = document.getElementById('dayFilter');
  df.innerHTML = '<option value="all">All days</option>' + days.map(d=>`<option value="${d}">${d}</option>`).join('');
  const nvList = NO_VISIT[name] || [];
  document.getElementById('nvCount').textContent = nvList.length || '0';
  render();
}

function render() {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const day    = document.getElementById('dayFilter').value;
  const status = document.getElementById('statusFilter').value;
  const sig    = document.getElementById('sigFilter').value;

  const list = currentPlan.filter(p => {
    if (day    !== 'all' && p.day    !== day)    return false;
    if (status !== 'all' && p.status !== status) return false;
    if (sig    !== 'all' && !(p.tags||[]).includes(sig)) return false;
    if (q && !(p.shop+p.address+p.notes+'').toLowerCase().includes(q)) return false;
    return true;
  });

  if (!list.length) {
    document.getElementById('grid').innerHTML = '<div class="empty">No shops match your filters.</div>';
  } else {
    const dayOrder = ['Half-day','Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','Day 7','Day 8','Day 9','Day 10','Day 11','Day 12','Day 13','Day 14','Day 15'];
    const grouped = {};
    list.forEach(p => { (grouped[p.day] = grouped[p.day]||[]).push(p); });
    const orderedDays = Object.keys(grouped).sort((a,b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
    const origin = PLAN_ORIGINS[planSel.value] || '';
    document.getElementById('grid').innerHTML = orderedDays.map(d => {
      const shops = grouped[d];
      const mapsUrl = buildMapsURL(origin, shops);
      const mapsBtn = origin ? `<a class="route-btn" href="${mapsUrl}" target="_blank" rel="noopener">📍 Open Route in Maps</a>` : '';
      return `<div class="day-header"><span class="day-label">${esc(d)}</span><span class="day-count">${shops.length} stop${shops.length!==1?'s':''}</span>${mapsBtn}</div>${shops.map(cardHTML).join('')}`;
    }).join('');
  }

  document.querySelectorAll('.status-sel').forEach(el =>
    el.addEventListener('change', e => onStatus(e.target)));
  document.querySelectorAll('.notes-btn').forEach(el =>
    el.addEventListener('click', e => toggleNotes(e.currentTarget.dataset.id)));
  document.querySelectorAll('.notes-area').forEach(el =>
    el.addEventListener('blur', e => onNote(e.target)));

  updateStats();
}

function renderNVCards(list, header, grid) {
  if (!list.length) {
    header.textContent = '';
    grid.innerHTML = '<div class="nv-empty">No existing Tekmetric customers identified in this area.</div>';
    return;
  }
  header.innerHTML = `<b>${list.length} existing Tekmetric customer${list.length!==1?'s':''}</b> near this route — use these as proof points when prospects ask "who else is using it nearby?"`;
  grid.innerHTML = list.map(nv => `
<div class="nv-card">
  <span class="nv-badge nv-confirmed">✓ Tekmetric Customer</span>
  <div class="nv-name">${esc(nv.shop)}</div>
  ${nv.address ? `<div class="nv-city">📍 ${esc(nv.address)}, ${esc(nv.city)}</div>` : `<div class="nv-city">📍 ${esc(nv.city)}</div>`}
  ${nv.notes ? `<div class="nv-note">${esc(nv.notes)}</div>` : ''}
</div>`).join('');
}

function renderNoVisit() {
  const name = planSel.value;
  const header = document.getElementById('nvHeader');
  const grid = document.getElementById('nvGrid');
  const hardcoded = NO_VISIT[name] || [];

  // For NJ plan: dynamic fetch from Google Sheet, merge with hardcoded
  if (name.includes('New Jersey') || name.includes('Parsippany')) {
    header.innerHTML = 'Loading existing customers from database…';
    grid.innerHTML = '<div class="nv-empty">Fetching…</div>';
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1a_mX62jYjrWNBNjLzrK_SlvdL4VMnQ3cMAfli96LWs0/gviz/tq?tqx=out:csv&sheet=report1780072999302&tq=select%20*%20where%20H%3D'NJ'";
    fetch(sheetUrl).then(r=>r.text()).then(csv=>{
      const lines = csv.trim().split('\n').slice(1);
      const parsed = lines.map(line=>{
        const cols = [];
        let cur='', inQ=false;
        for(const ch of line+','){
          if(ch==='"'){inQ=!inQ;}
          else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
          else cur+=ch;
        }
        // col 0=name, col 5=city(?), col 7=state
        const shop = cols[0]||'';
        const city = (cols[5]||cols[4]||'').replace(/^"|"$/g,'') + ', NJ';
        return shop ? {shop, city, notes:'Existing Tekmetric customer — Google Sheet confirmed'} : null;
      }).filter(Boolean);
      // Merge, dedup by shop name
      const seen = new Set(hardcoded.map(x=>x.shop.toLowerCase()));
      const merged = [...hardcoded, ...parsed.filter(x=>!seen.has(x.shop.toLowerCase()))];
      document.getElementById('nvCount').textContent = merged.length || '0';
      renderNVCards(merged, header, grid);
    }).catch(()=>{
      document.getElementById('nvCount').textContent = hardcoded.length || '0';
      renderNVCards(hardcoded, header, grid);
    });
    return;
  }

  renderNVCards(hardcoded, header, grid);
}

function mitchellScore(p) {
  const t = p.tags||[];
  let s = 0;
  const stars = parseFloat(p.stars)||0;
  const rv = (p.reviewInfo||'').match(/(\d[\d,]*)\s+review/i);
  const rc = rv ? parseInt(rv[1].replace(/,/g,''),10) : 0;
  if(stars>=4.5)                                           s++;
  if(rc>=100)                                              s++;
  if(t.includes('Mitchell'))                               s++;
  if(t.includes('Technet'))                                s++;
  if(t.includes('AutoTechIQ'))                             s++;
  if(t.includes('NAPA')||t.includes('AAA')||t.includes('Marquee')) s++;
  return Math.min(s,5);
}

function onStatus(sel, silent) {
  const id = sel.dataset.id;
  statusMap[id] = sel.value;
  if (!silent) saveStatus(id);
  const p = currentPlan.find(x=>x.id===id);
  if(p) p.status = sel.value;
  const card = document.getElementById('card-'+id);
  if(card){
    ['sv','sf','sw','sn','sd'].forEach(c=>card.classList.remove(c));
    const cl={visited:'sv',followup:'sf',won:'sw','not-interested':'sn','demo-booked':'sd'}[sel.value];
    if(cl) card.classList.add(cl);
  }
  if (!silent) updateStats();
}

function toggleNotes(id) {
  const card = document.getElementById('card-'+id);
  const ta = card&&card.querySelector('.notes-area');
  if(!ta) return;
  const open = ta.style.display==='block';
  ta.style.display = open?'none':'block';
  if(!open) ta.focus();
}

function onNote(ta) {
  const id = ta.dataset.id, notes = ta.value.trim();
  notesMap[id] = notes;
  saveNotes(id);
  const p = currentPlan.find(x=>x.id===id);
  if(p) p.userNotes = notes;
  const card = document.getElementById('card-'+id);
  if(!card) return;
  const btn = card.querySelector('.notes-btn');
  if(btn) btn.classList.toggle('has', !!notes);
  let prev = card.querySelector('.notes-preview');
  if(notes){
    if(!prev){ prev=document.createElement('div'); prev.className='notes-preview'; prev.onclick=()=>toggleNotes(id); ta.before(prev); }
    prev.textContent = '📌 '+notes;
  } else if(prev) prev.remove();
}

function updateStats() {
  document.getElementById('sTotal').textContent    = currentPlan.length;
  const VISITED_STATUSES = ['visited','followup','won','not-interested'];
  document.getElementById('sVisited').textContent  = currentPlan.filter(p=>VISITED_STATUSES.includes(p.status)).length;
  document.getElementById('sFollowup').textContent = currentPlan.filter(p=>p.status==='followup').length;
  document.getElementById('sWon').textContent      = currentPlan.filter(p=>p.status==='won').length;
  document.getElementById('sMitchell').textContent = currentPlan.filter(p=>mitchellScore(p)>=3).length;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const ALL_PLAN_KEYS = Object.keys(PLANS);

function getSettings() {
  try {
    const s = localStorage.getItem('fp_settings');
    return s ? JSON.parse(s) : { repName: '', myPlans: null };
  } catch(e) { return { repName: '', myPlans: null }; }
}

function applySettings(settings) {
  // Filter planSel dropdown
  const sel = document.getElementById('planSel');
  if (!sel) return;
  const current = sel.value;
  sel.innerHTML = '';
  const visiblePlans = (!settings.myPlans || settings.myPlans.length === 0)
    ? ALL_PLAN_KEYS
    : ALL_PLAN_KEYS.filter(k => settings.myPlans.includes(k));
  visiblePlans.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = k;
    sel.appendChild(o);
  });
  // Restore selection if still visible, else pick first
  if (visiblePlans.includes(current)) sel.value = current;
  else if (visiblePlans.length) sel.value = visiblePlans[0];
  // Re-render
  loadPlan(sel.value);
}

function openSettings() {
  const settings = getSettings();
  document.getElementById('repNameInput').value = settings.repName || '';
  const checks = document.getElementById('planChecks');
  checks.innerHTML = '';
  ALL_PLAN_KEYS.forEach(k => {
    const checked = !settings.myPlans || settings.myPlans.includes(k);
    checks.innerHTML += `<label class="plan-check">
      <input type="checkbox" value="${k}" ${checked ? 'checked' : ''}>
      <span>${k}</span>
    </label>`;
  });
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function toggleAllPlans(checked) {
  document.querySelectorAll('#planChecks input[type=checkbox]').forEach(cb => cb.checked = checked);
}

function saveSettings() {
  const repName = document.getElementById('repNameInput').value.trim();
  const checked = [...document.querySelectorAll('#planChecks input[type=checkbox]:checked')].map(cb => cb.value);
  const myPlans = checked.length === ALL_PLAN_KEYS.length ? null : checked;
  const settings = { repName, myPlans };
  try { localStorage.setItem('fp_settings', JSON.stringify(settings)); } catch(e) {}

  // Update rep name display & SYNC_KEY prefix hint
  updateRepDisplay(repName);

  closeSettings();
  applySettings(settings);
}

function updateRepDisplay(name) {
  // Show name next to sync icon if set
  const existing = document.getElementById('repDisplay');
  if (existing) existing.remove();
  if (name) {
    const span = document.createElement('span');
    span.id = 'repDisplay';
    span.className = 'rep-display';
    span.title = 'Signed in as: ' + name;
    span.textContent = '👤 ' + name;
    document.querySelector('.hdr-top').insertBefore(span, document.getElementById('syncStatus'));
  }
}

// Init settings on load
(function initSettings() {
  const settings = getSettings();
  if (settings.repName) updateRepDisplay(settings.repName);
  // Apply plan filter after planSel is populated
  const origPopulate = window._populatePlanSel;
  // Hook into plan selector population
  const observer = new MutationObserver(() => {
    const sel = document.getElementById('planSel');
    if (sel && sel.options.length > 0) {
      observer.disconnect();
      if (settings.myPlans && settings.myPlans.length > 0) {
        applySettings(settings);
      }
    }
  });
  observer.observe(document.getElementById('planSel'), { childList: true });
})();

function buildShopLookup(){
  var lk = {};
  Object.entries(PLANS).forEach(function(e){
    var pn = e[0], shops = e[1];
    shops.forEach(function(s){ lk[s.id] = {shop: s.shop, plan: pn, day: s.day}; });
  });
  return lk;
}

function loadTeamFeed(){
  var feedEl = document.getElementById('teamFeed');
  if(!feedEl) return;
  feedEl.innerHTML = '<div style="padding:20px;color:#64748b;text-align:center">Loading team activity…</div>';
  var lk = buildShopLookup();
  var allIds = Object.keys(lk);
  var db = firebase.firestore();
  Promise.all([db.collection('fp_reps').get(), db.collection('fp_status').get()])
  .then(function(results){
    var repsSnap = results[0], statusSnap = results[1];
    var repNames = {};
    repsSnap.forEach(function(d){ repNames[d.id] = d.data().name; });
    var acts = [];
    statusSnap.forEach(function(d){
      var docId = d.id, data = d.data();
      if(!data.status || data.status === 'new') return;
      var matchId = null, prefix = '';
      for(var i = 0; i < allIds.length; i++){
        var sid = allIds[i];
        if(docId === sid){ matchId = sid; prefix = ''; break; }
        if(docId.length > sid.length && docId.slice(-sid.length) === sid){ matchId = sid; prefix = docId.slice(0, docId.length - sid.length); break; }
      }
      if(!matchId) return;
      var info = lk[matchId];
      var repLabel = prefix === '' ? 'Me' : (repNames[prefix] || 'Rep ' + prefix.slice(0,6));
      var ts = data.updatedAt ? data.updatedAt.toDate() : null;
      acts.push({rep: repLabel, repKey: prefix, shop: info.shop, plan: info.plan, day: info.day, status: data.status, notes: data.notes || '', ts: ts, tsMs: ts ? ts.getTime() : 0});
    });
    acts.sort(function(a, b){ return b.tsMs - a.tsMs; });
    renderTeamFeed(acts, repNames);
  }).catch(function(e){
    var feedEl2 = document.getElementById('teamFeed');
    if(feedEl2) feedEl2.innerHTML = '<div style="padding:20px;color:#dc2626">Error: ' + e.message + '</div>';
  });
}

function saveRepName(uuid, name, btn){
  btn.disabled = true; btn.textContent = '…';
  firebase.firestore().collection('fp_reps').doc(uuid).set({name: name, updatedAt: firebase.firestore.FieldValue.serverTimestamp()})
  .then(function(){ btn.textContent = '✓'; setTimeout(loadTeamFeed, 500); });
}

var _STAT_LABELS = {visited: '✅ Visited', followup: '📞 Follow-up', won: '🎯 Demo Booked', 'not-interested': '🚫 Not interested', skip: '⏭ Skip'};

function filterTeam(btn, rep){
  document.querySelectorAll('.tf-btn').forEach(function(b){ b.classList.remove('tf-on'); });
  btn.classList.add('tf-on');
  document.querySelectorAll('.team-item').forEach(function(el){
    el.style.display = (!rep || el.dataset.rep === rep) ? '' : 'none';
  });
}

function renderTeamFeed(acts, repNames){
  var feedEl = document.getElementById("teamFeed");
  if(!feedEl) return;
  var seen = {}, regRows = "";
  acts.forEach(function(a){
    if(a.repKey && !seen[a.repKey]){
      seen[a.repKey] = true;
      var saved = (repNames[a.repKey] || "").replace(/"/g,"&quot;");
      var short = a.repKey.slice(0,8);
      regRows += "<div style=\"display:flex;align-items:center;gap:8px;margin:4px 0\">"
        + "<span style=\"font-size:11px;color:#64748b;font-family:monospace\">" + short + "...</span>"
        + "<input class=\"rep-name-inp\" data-k=\"" + a.repKey + "\" style=\"border:1px solid #cbd5e1;border-radius:4px;padding:3px 8px;font-size:13px;flex:1;min-width:0\" placeholder=\"Enter name\" value=\"" + saved + "\">"
        + "<button class=\"rep-save-btn\" data-k=\"" + a.repKey + "\" style=\"background:#2563eb;color:#fff;border:none;border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap\">Save</button>"
        + "</div>";
    }
  });
  var regHtml = regRows
    ? "<div style=\"background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-bottom:16px\">"
      + "<div style=\"font-size:11px;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:.05em;margin-bottom:8px\">Name Your Reps</div>"
      + regRows + "</div>"
    : "";
  var reps = acts.map(function(a){ return a.rep; }).filter(function(r,i,arr){ return arr.indexOf(r) === i; });
  var btnStyle = "border:1px solid #cbd5e1;border-radius:20px;padding:4px 14px;font-size:12px;cursor:pointer;background:#fff;color:#374151";
  var filterHtml = reps.length > 1
    ? "<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px\">"
      + "<button class=\"tf-btn tf-on\" data-rep=\"\" style=\"" + btnStyle + "\">All (" + acts.length + ")</button>"
      + reps.map(function(r){
          var cnt = acts.filter(function(a){ return a.rep === r; }).length;
          var sr = r.replace(/"/g,"&quot;");
          return "<button class=\"tf-btn\" data-rep=\"" + sr + "\" style=\"" + btnStyle + "\">" + sr + " (" + cnt + ")</button>";
        }).join("") + "</div>"
    : "";
  var itemsHtml = acts.length
    ? acts.map(function(a){
        var tsStr = a.ts ? a.ts.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " " + a.ts.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : "";
        var stBadge = _STAT_LABELS[a.status] || a.status;
        var sr = a.rep.replace(/"/g,"&quot;");
        return "<div class=\"team-item\" data-rep=\"" + sr + "\" style=\"background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-bottom:8px\">"
          + "<div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px\">"
          + "<b style=\"color:#1e293b\">" + a.rep + "</b>"
          + "<span style=\"color:#94a3b8\">&rarr;</span>"
          + "<span style=\"color:#0f172a;font-weight:500\">" + a.shop + "</span>"
          + "<span style=\"background:#f1f5f9;border-radius:4px;padding:2px 8px;font-size:12px;white-space:nowrap\">" + stBadge + "</span>"
          + "</div>"
          + "<div style=\"font-size:12px;color:#64748b\">" + a.plan + " &middot; " + a.day + (tsStr ? " &middot; " + tsStr : "") + "</div>"
          + (a.notes ? "<div style=\"margin-top:6px;font-size:13px;color:#374151;white-space:pre-line\">" + a.notes + "</div>" : "")
          + "</div>";
      }).join("")
    : "<div style=\"color:#94a3b8;text-align:center;padding:40px\">No field activity recorded yet.</div>";
  feedEl.innerHTML =
    "<style>.tf-btn.tf-on{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important}</style>"
    + "<div style=\"font-size:18px;font-weight:700;color:#0f172a;margin-bottom:16px\">Team Feed</div>"
    + regHtml + filterHtml + itemsHtml;
  feedEl.onclick = function(e){
    var fb = e.target.closest(".tf-btn");
    if(fb){
      feedEl.querySelectorAll(".tf-btn").forEach(function(b){ b.classList.remove("tf-on"); });
      fb.classList.add("tf-on");
      var rep = fb.getAttribute("data-rep");
      feedEl.querySelectorAll(".team-item").forEach(function(el){
        el.style.display = (!rep || el.getAttribute("data-rep") === rep) ? "" : "none";
      });
      return;
    }
    var sb = e.target.closest(".rep-save-btn");
    if(sb){
      var uuid = sb.getAttribute("data-k");
      var inp = feedEl.querySelector(".rep-name-inp[data-k=\"" + uuid + "\"]");
      if(inp) saveRepName(uuid, inp.value, sb);
    }
  };
}
// ── END TEAM FEED ──</script>
</body>
</html>
